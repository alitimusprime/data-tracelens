[project]
name = "tracelens-ai"
version = "0.1.0"
description = "Evidence-grounded incident investigation for distributed systems"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [".", "apps/tracelens_api"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/web", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests"]
