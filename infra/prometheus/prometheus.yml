global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: demo-services
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8000]
        labels: {service: gateway}
      - targets: [order:8000]
        labels: {service: order}
      - targets: [inventory:8000]
        labels: {service: inventory}
      - targets: [payment:8000]
        labels: {service: payment}
      - targets: [notification:8000]
        labels: {service: notification}
      - targets: [tracelens-api:8080]
        labels: {service: tracelens-api}
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
